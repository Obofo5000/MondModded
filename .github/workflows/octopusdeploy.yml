name: Build iOS Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build iOS App and Create IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build and Package App
        run: |
          echo "Bắt đầu quá trình build ứng dụng iOS..."
          # Thêm các lệnh biên dịch Xcode hoặc script build project tại đây (ví dụ: xcodebuild)
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: |
            # Đường dẫn tới file .ipa sau khi build xong (ví dụ: build/Release-iphoneos/*.ipa hoặc thư mục chứa output)
            *.ipa
